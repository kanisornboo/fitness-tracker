name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  client:
    name: Client — Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_STRAPI_URL: ${{ secrets.VITE_STRAPI_URL || 'http://localhost:1337' }}

  server:
    name: Server — Type-check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          HOST: 0.0.0.0
          PORT: 1337
          APP_KEYS: ci_key_1,ci_key_2
          API_TOKEN_SALT: ci_salt
          ADMIN_JWT_SECRET: ci_admin_jwt
          TRANSFER_TOKEN_SALT: ci_transfer_salt
          JWT_SECRET: ci_jwt_secret
          ENCRYPTION_KEY: ci_encryption_key
          DATABASE_CLIENT: sqlite
          DATABASE_FILENAME: .tmp/data.db
          GEMINI_API_KEY: placeholder
